<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="/assets/icons/calculator-icon.svg">
</head>

<body>

    <div class="calculator">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="left">
                <h3 class="title">Scientific</h3>
            </div>

            <button id="historyToggle" class="icon-btn">
                <img src="assets/icons/history-logo.svg" />
            </button>
        </div>

        <!-- Display -->
        <div class="display">
            <div class="result">0</div>
        </div>

        <!-- Mode -->
        <div class="mode-row">
            <button>DEG</button>
            <button>F-E</button>
        </div>

        <!-- Memory -->
        <div class="memory-row">
            <button>MC</button>
            <button>MR</button>
            <button>M+</button>
            <button>M-</button>
            <button>MS</button>
        </div>

        <!-- Function Tabs -->
        <div class="function-tabs">

            <!-- Trigonometry -->
            <div class="dropdown">
                <button class="dropdown-btn">
                    <img src="assets/icons/trigonometry.svg" />
                    Trigonometry
                    <img src="assets/icons/drop-down.svg" class="arrow" />
                </button>

                <div class="dropdown-content">
                    <button>2ⁿᵈ</button>
                    <button>sin</button>
                    <button>cos</button>
                    <button>tan</button>

                    <button>hyp</button>
                    <button>sec</button>
                    <button>csc</button>
                    <button>cot</button>
                </div>
            </div>

            <!-- Function -->
            <div class="dropdown">
                <button class="dropdown-btn">
                    <img src="assets/icons/functions.svg" />
                    Function
                    <img src="assets/icons/drop-down.svg" class="arrow" />
                </button>

                <div class="dropdown-content small">
                    <button>|x|</button>
                    <button>⌊x⌋</button>
                    <button>⌈x⌉</button>

                    <button>rand</button>
                    <button>→dms</button>
                    <button>→deg</button>
                </div>
            </div>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button>2ⁿᵈ</button>
            <button>π</button>
            <button>e</button>
            <button>C</button>
            <button><img src="assets/icons/backspace.svg" /></button>

            <button>x²</button>
            <button>1/x</button>
            <button>|x|</button>
            <button>exp</button>
            <button>mod</button>

            <button>²√x</button>
            <button>(</button>
            <button>)</button>
            <button>n!</button>
            <button>÷</button>

            <button>xʸ</button>
            <button class="primary-btn">7</button>
            <button class="primary-btn">8</button>
            <button class="primary-btn">9</button>
            <button>×</button>

            <button>10ˣ</button>
            <button class="primary-btn">4</button>
            <button class="primary-btn">5</button>
            <button class="primary-btn">6</button>
            <button>−</button>

            <button>log</button>
            <button class="primary-btn">1</button>
            <button class="primary-btn">2</button>
            <button class="primary-btn">3</button>
            <button>+</button>

            <button>ln</button>
            <button class="primary-btn">+/-</button>
            <button class="primary-btn">0</button>
            <button class="primary-btn">.</button>
            <button class="equals">=</button>

        </div>
    </div>

</body>

</html>
